name: API Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'

jobs:
  test:
    name: REST Assured + Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload Cucumber and Extent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/cucumber-reports/
            target/extent-reports/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
