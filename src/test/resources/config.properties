# ═══════════════════════════════════════
# REST Assured API Framework Config
# ═══════════════════════════════════════

# API Base URL (Restful-Booker - free public API)
base.url=https://restful-booker.herokuapp.com

# Authentication credentials (default admin)
auth.username=admin
auth.password=password123

# Request Timeouts (milliseconds)
connection.timeout=10000
socket.timeout=30000

# Logging
log.requests=true
log.responses=true
